[project]
name = "smtp-gateway-workspace"
version = "0.0.5"
description = "SMTP gateway server and management API client workspace"
requires-python = ">=3.15,<3.16"
dependencies = [
    "smtp-gateway-client",
    "smtp-gateway-server",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.17.1,<0.18",
    "ty>=0.0.89,<0.1",
    "typing-extensions>=4.16,<5",
]

[tool.uv]
package = false

[tool.uv.sources]
smtp-gateway-client = { workspace = true }
smtp-gateway-server = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]
