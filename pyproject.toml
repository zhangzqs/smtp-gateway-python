[project]
name = "smtp-gateway-python"
version = "0.1.0"
description = "Durable SMTP gateway with authenticated management and retry delivery"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "aiosmtpd>=1.4.6,<2",
    "aiosmtplib>=3.0,<6",
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.30,<1",
    "cryptography>=44",
    "fastapi>=0.115",
    "pydantic-settings>=2.4,<3",
    "pyyaml>=6.0,<7",
    "sqlalchemy[asyncio]>=2.0.38,<3",
    "typing-extensions>=4.12,<5",
    "uvicorn>=0.30",
]

[project.scripts]
smtp-gateway = "smtp_gateway.cli:main"

[project.urls]
Repository = "https://github.com/zhangzqs/smtp-gateway-python"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.16.10",
    "ty>=0.0.11",
]

[build-system]
requires = ["hatchling<1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smtp_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = ["--strict-config", "--strict-markers"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
missing-override-decorator = "error"
