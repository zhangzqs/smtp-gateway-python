[project]
name = "smtp-gateway-workspace"
version = "0.0.3"
description = "SMTP gateway server and management API client workspace"
requires-python = ">=3.11,<3.12"
dependencies = [
    "smtp-gateway-client",
    "smtp-gateway-server",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.16.10",
    "ty>=0.0.11",
]

[tool.uv]
package = false

[tool.uv.sources]
smtp-gateway-client = { workspace = true }
smtp-gateway-server = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]
