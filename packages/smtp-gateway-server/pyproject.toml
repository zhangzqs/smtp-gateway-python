[project]
name = "smtp-gateway-server"
version = "0.0.6"
description = "Durable SMTP gateway with authenticated configuration management"
readme = "README.md"
requires-python = ">=3.15,<3.16"
license = "Apache-2.0"
dependencies = [
    "aiosmtpd>=1.4.6,<2",
    "aiosmtplib>=5.1.3,<6",
    "aiosqlite>=0.22.1,<1",
    "asyncpg>=0.32.0,<1",
    "cryptography>=50.0.2",
    "fastapi>=0.151.0,<1",
    "pydantic-settings>=2.16.1,<3",
    "pyyaml>=6.0.3,<7",
    "smtp-gateway-client==0.0.6",
    "sqlalchemy[asyncio]>=2.1.5,<3",
    "uvicorn>=0.54.0,<1",
]

[project.scripts]
smtp-gateway = "smtp_gateway.cli:main"

[project.urls]
Repository = "https://github.com/zhangzqs/smtp-gateway-python"

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smtp_gateway"]

[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "smtp_gateway/LICENSE"
"../../NOTICE" = "smtp_gateway/NOTICE"

[tool.ty.environment]
python-version = "3.15"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
missing-override-decorator = "error"
