version: "3"

includes:
  client:
    taskfile: ./packages/smtp-gateway-client/Taskfile.yaml
    dir: ./packages/smtp-gateway-client
    internal: true
  server:
    taskfile: ./packages/smtp-gateway-server/Taskfile.yaml
    dir: ./packages/smtp-gateway-server
    internal: true

tasks:
  default:
    silent: true
    cmds:
      - task --list

  setup:
    desc: 安装全部 workspace 成员与开发工具
    cmds:
      - uv sync --locked --all-packages

  fix:
    desc: 格式化 workspace 并执行安全 lint 修复
    cmds:
      - task: client:fix
      - task: server:fix

  check:
    desc: 检查所有成员的 lint、格式与类型
    cmds:
      - task: client:check
      - task: server:check

  test:
    desc: 测试所有 workspace 成员
    cmds:
      - task: client:test
      - task: server:test

  build:
    desc: 构建客户端与服务端 wheel
    cmds:
      - task: client:build
      - task: server:build

  image:
    desc: 构建服务端镜像并检查命令入口
    cmds:
      - docker build --tag smtp-gateway-python:local .
      - docker run --rm smtp-gateway-python:local --version
