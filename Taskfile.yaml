version: "3"

includes:
  client:
    taskfile: ./packages/smtp-gateway-client/Taskfile.yaml
    dir: ./packages/smtp-gateway-client
    internal: true
  server:
    taskfile: ./packages/smtp-gateway-server/Taskfile.yaml
    dir: ./packages/smtp-gateway-server
    internal: true

tasks:
  default:
    silent: true
    cmds:
      - task --list

  setup:
    desc: 安装全部 workspace 成员与开发工具
    cmds:
      - uv sync --locked --all-packages

  fix:
    desc: 格式化 workspace 并执行安全 lint 修复
    cmds:
      - task: client:fix
      - task: server:fix

  check:
    desc: 检查所有成员的 lint、格式与类型
    cmds:
      - task: client:check
      - task: server:check

  test:
    desc: 测试所有 workspace 成员
    cmds:
      - task: client:test
      - task: server:test

  build:
    desc: 构建客户端与服务端 wheel
    cmds:
      - task: client:build
      - task: server:build

  test-client-wheel:
    desc: 使用 Python 3.11 测试已构建的客户端 wheel
    cmds:
      - task: client:test-wheel

  image:
    desc: 构建本机架构的服务端镜像并检查命令入口
    cmds:
      - docker build --tag smtp-gateway-python:local .
      - task: image-check
        vars:
          IMAGE: smtp-gateway-python:local
          VERSION:
            sh: uv version --package smtp-gateway-server --short

  image-check:
    desc: 验证指定镜像的版本、运行依赖和 CA 证书
    requires:
      vars: [IMAGE, VERSION]
    cmds:
      - test "$(docker run --rm --network none "{{.IMAGE}}" --version)" = "{{.VERSION}}"
      - >-
        docker run --rm --network none --entrypoint python "{{.IMAGE}}"
        -c "import asyncpg, ssl; from smtp_gateway.app import create_app;
        assert ssl.create_default_context().cert_store_stats()['x509_ca'] > 0"
