name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.15.0"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.3"
          enable-cache: true
      - uses: go-task/setup-task@v2.2.0
        with:
          version: "3.54.0"
      - name: Set up workspace
        run: task setup
      - name: Check
        run: task check
      - name: Test
        run: task test
      - name: Build wheels
        run: task build
      - name: Test client wheel on Python 3.11
        run: task test-client-wheel
      - name: Verify wheel artifacts
        run: |
          python - <<'PY'
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          expected = {"smtp_gateway_server", "smtp_gateway_client"}
          assert len(wheels) == 2, wheels
          assert {path.name.split("-")[0] for path in wheels} == expected, wheels
          PY
      - name: Verify server image
        run: task image
