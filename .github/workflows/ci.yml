name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check src tests
      - name: Check formatting
        run: uv run --locked ruff format --check src tests
      - name: Check types
        run: uv run --locked ty check --project .
      - name: Test
        run: uv run --locked pytest tests
      - name: Build wheel
        run: uv build --wheel
      - name: Build container
        run: docker build --tag smtp-gateway-python:ci .
      - name: Check container entry point
        run: docker run --rm smtp-gateway-python:ci --version
