# 密码和 Fernet 密钥通过 SMTP_GATEWAY_ 环境变量注入。
# 例如 SMTP_GATEWAY_HTTP__AUTH__PASSWORD；YAML 不执行变量插值。
http:
  host: 0.0.0.0
  port: 8080
  auth:
    username: manager

smtp:
  host: 0.0.0.0
  port: 1025
  auth:
    username: submission
  tls:
    cert_file: /run/secrets/smtp-server-cert.pem
    key_file: /run/secrets/smtp-server-key.pem
  allow_insecure_auth: false

database:
  url: sqlite+aiosqlite:////data/smtp-gateway.db

limits:
  max_message_bytes: 10485760
  max_recipients: 100

delivery:
  max_attempts: 5
  retry_delay: 30
  max_retry_delay: 3600
  timeout: 60
  lease_seconds: 120
  poll_interval: 1
  concurrency: 4
  retention_seconds: 604800
